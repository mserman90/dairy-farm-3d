<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="gradBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#270e02" />
    </linearGradient>
    <linearGradient id="muzzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle badge -->
  <circle cx="50" cy="50" r="48" fill="url(#gradBg)" stroke="#075e54" stroke-width="3" />
  
  <!-- Horns -->
  <path d="M 32 38 C 22 24 16 12 10 18 C 18 28 26 38 32 46 Z" fill="url(#hornGrad)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M 68 38 C 78 24 84 12 90 18 C 82 28 74 38 68 46 Z" fill="url(#hornGrad)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Ears -->
  <ellipse cx="23" cy="46" rx="10" ry="5" transform="rotate(-25 23 46)" fill="#451a03" />
  <ellipse cx="23" cy="46" rx="7" ry="3" transform="rotate(-25 23 46)" fill="#f87171" />
  
  <ellipse cx="77" cy="46" rx="10" ry="5" transform="rotate(25 77 46)" fill="#451a03" />
  <ellipse cx="77" cy="46" rx="7" ry="3" transform="rotate(25 77 46)" fill="#f87171" />
  
  <!-- Head base -->
  <path d="M 28 36 C 36 32 64 32 72 36 C 76 46 76 60 70 68 C 65 74 35 74 30 68 C 24 60 24 46 28 36 Z" fill="url(#headGrad)" />
  
  <!-- Forehead curl / tuft -->
  <path d="M 44 32 C 48 27 52 27 56 32 C 54 36 46 36 44 32 Z" fill="#78350f" />
  
  <!-- Eyes -->
  <ellipse cx="38" cy="48" rx="4" ry="4.5" fill="#111827" />
  <circle cx="37" cy="47" r="1.5" fill="#ffffff" />
  <ellipse cx="62" cy="48" rx="4" ry="4.5" fill="#111827" />
  <circle cx="61" cy="47" r="1.5" fill="#ffffff" />
  
  <!-- Muzzle -->
  <path d="M 34 58 C 34 54 66 54 66 58 C 68 68 66 78 50 78 C 34 78 32 68 34 58 Z" fill="url(#muzzleGrad)" stroke="#ea580c" stroke-width="1" />
  
  <!-- Nostrils -->
  <ellipse cx="43" cy="67" rx="3" ry="4" fill="#451a03" />
  <ellipse cx="57" cy="67" rx="3" ry="4" fill="#451a03" />
  
  <!-- Septum ring (Tosun ring) -->
  <path d="M 46 72 C 46 78 54 78 54 72" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
</svg>
